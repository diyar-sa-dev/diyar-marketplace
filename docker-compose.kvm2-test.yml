# DIYAR — isolated KVM2-equivalent overlay (Phase 1 strict envelope)
#
# Docker Desktop / WSL2 VM: 4 vCPU / 8 GiB
# DIYAR stack: cpuset 0-1 (2 vCPU shared — VPS-like scheduler)
# k6:          cpuset 2-3 (load generator outside the envelope)
# RAM limits:  6464 MiB (~6.3 GiB) + Docker/k6 headroom ≈ 8 GiB
#
# Per-container CPU quotas that summed to ~3.95 were removed: they let the
# stack use nearly the whole 4-CPU VM and did not model a 2 vCPU VPS.

services:
  mysql:
    cpuset: '0-1'
    # NTFS bind-mount of mysql-kvm2.cnf is world-writable; MySQL 8 ignores it.
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --max-connections=100
      - --slow-query-log=ON
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=1
    deploy:
      resources:
        limits:
          memory: 2560M

  redis:
    cpuset: '0-1'
    deploy:
      resources:
        limits:
          memory: 576M

  app:
    cpuset: '0-1'
    environment:
      OCTANE_WORKERS: ${OCTANE_WORKERS:-2}
    deploy:
      resources:
        limits:
          memory: 1536M

  nginx:
    cpuset: '0-1'
    deploy:
      resources:
        limits:
          memory: 128M

  queue-critical:
    cpuset: '0-1'
    deploy:
      resources:
        limits:
          memory: 384M

  queue-default:
    cpuset: '0-1'
    deploy:
      resources:
        limits:
          memory: 384M

  queue-analytics:
    cpuset: '0-1'
    deploy:
      resources:
        limits:
          memory: 384M

  scheduler:
    cpuset: '0-1'
    deploy:
      resources:
        limits:
          memory: 128M

  reverb-1:
    cpuset: '0-1'
    deploy:
      resources:
        limits:
          memory: 384M

  reverb-2:
    cpuset: '0-1'
    deploy:
      resources:
        limits:
          memory: 384M
