name: Messaging Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/messaging-integration.yml'

jobs:
  messaging-integration:
    name: Backend — MySQL + Redis + queue
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: diyar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: diyar_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      DIYAR_OUTBOX_ENABLED: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, intl, redis
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Messaging integration tests
        run: php artisan test --filter="DomainOutboxIntegrationTest|ReconcileNotificationDeliveriesTest|NotificationDeliveryStateMachineTest|ChatModerationTest|AdminChatOversightTest"

      - name: Start queue worker (background)
        run: php artisan queue:work redis --queue=notifications,notifications-high --stop-when-empty --tries=1 &
        shell: bash

      - name: Process outbox once
        run: php artisan outbox:process
