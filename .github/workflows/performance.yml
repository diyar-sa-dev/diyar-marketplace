name: Performance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  k6-smoke:
    name: k6 load smoke (manual/weekly)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, intl
          tools: composer:v2

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Bootstrap API for load test
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite
          export DB_CONNECTION=sqlite
          export DB_DATABASE=database/database.sqlite
          export CACHE_STORE=redis
          export REDIS_HOST=127.0.0.1
          export QUEUE_CONNECTION=sync
          export DIYAR_PAYMENT_USE_FAKE_GATEWAY=true
          php artisan migrate:fresh --seed --force
          php artisan serve --host=127.0.0.1 --port=8000 &
          sleep 5

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run k6 smoke (10→100 VUs)
        run: k6 run scripts/performance/smoke.js
        env:
          BASE_URL: http://127.0.0.1:8000/api/v1

      - name: Upload k6 summary
        if: always()
        run: |
          echo "Load test executed at $(date -u)" > k6-summary.txt
          echo "25K VUs NOT VERIFIED — workflow capped at smoke profile." >> k6-summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: k6-summary.txt
