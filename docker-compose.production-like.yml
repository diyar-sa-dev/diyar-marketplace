# DIYAR — production-like local stack (FPM benchmark + Vercel cross-origin dev)
#
# Usage:
#   docker compose -p diyar-fpm -f docker-compose.production-like.yml up -d --build
#   docker compose -p diyar-fpm -f docker-compose.production-like.yml exec app php artisan migrate --force --seed

name: diyar-fpm

x-app-env: &app-env
  APP_ENV: staging
  APP_DEBUG: 'false'
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: diyar_staging_like
  DB_USERNAME: diyar
  DB_PASSWORD: prodlike_secret
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PREFIX: diyar-staging-prodlike-
  DIYAR_ENFORCE_REDIS_IN_PRODUCTION: 'false'
  APP_KEY: base64:2fl+KtvkblFZiGZtacP1ZAwJfvyIZxSzUI/qpgQHoW0=
  DIYAR_LOADTEST_MODE: 'false'
  DIYAR_PAYMENT_USE_FAKE_GATEWAY: 'true'
  FRONTEND_URL: http://localhost:3000
  DIYAR_FRONTEND_URL: http://localhost:3000
  SANCTUM_STATEFUL_DOMAINS: localhost,localhost:3000,127.0.0.1,127.0.0.1:3000
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: diyar
  REVERB_APP_KEY: diyar-reverb-key
  REVERB_APP_SECRET: diyar-reverb-secret
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8090
  REVERB_HOST: localhost
  REVERB_PORT: 8092
  REVERB_SCHEME: http

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: prodlike_root
      MYSQL_DATABASE: diyar_staging_like
      MYSQL_USER: diyar
      MYSQL_PASSWORD: prodlike_secret
    volumes:
      - diyar_prodlike_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pprodlike_root']
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - diyar_prodlike_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.fpm
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - ./backend:/var/www/diyar/backend
      - ./deploy/php/fpm-pool-kvm2.conf:/usr/local/etc/php-fpm.d/zz-diyar.conf:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile.fpm
    restart: unless-stopped
    environment:
      <<: *app-env
    command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8090']
    volumes:
      - ./backend:/var/www/diyar/backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.fpm
    restart: unless-stopped
    environment:
      <<: *app-env
    command: ['php', 'artisan', 'queue:work', 'redis', '--queue=critical,default,notifications-high,notifications,broadcast,chat', '--sleep=1', '--tries=3', '--timeout=120']
    volumes:
      - ./backend:/var/www/diyar/backend
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.fpm
    restart: unless-stopped
    environment:
      <<: *app-env
    command: ['sh', '-c', 'while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done']
    volumes:
      - ./backend:/var/www/diyar/backend
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '8092:80'
    volumes:
      - ./deploy/nginx/production-like.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/diyar/backend/public:ro
      - ./backend/storage:/var/www/diyar/backend/storage:ro
    depends_on:
      - app
      - reverb
    networks:
      - backend

volumes:
  diyar_prodlike_mysql:
  diyar_prodlike_redis:

networks:
  backend:
    driver: bridge
