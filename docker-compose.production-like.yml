# DIYAR — Local VPS Production Simulation Stack
# Canonical local topology replicating Hostinger KVM 2 constraints.
# Nginx Gateway (:8092) -> Built Frontend SPA + API (:9000) + Reverb (:8090)
# MySQL 8.0 (diyar_vps_simulation) + Redis 7 (diyar_vps_sim_) + Queue Workers + Scheduler
#
# Usage:
#   npm --prefix frontend run build
#   docker compose -p diyar-vps-sim -f docker-compose.production-like.yml up -d --build
#   docker compose -p diyar-vps-sim -f docker-compose.production-like.yml exec app php artisan migrate --force

name: diyar-vps-sim

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: 'false'
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: diyar_vps_simulation
  DB_USERNAME: diyar
  DB_PASSWORD: sim_db_secret
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PREFIX: diyar_vps_sim_
  DIYAR_ENFORCE_REDIS_IN_PRODUCTION: 'true'
  APP_KEY: base64:2fl+KtvkblFZiGZtacP1ZAwJfvyIZxSzUI/qpgQHoW0=
  DIYAR_LOADTEST_MODE: 'false'
  DIYAR_VPS_SIMULATION: 'true'
  DIYAR_PAYMENT_USE_FAKE_GATEWAY: 'true'
  DIYAR_SMS_DRIVER: log
  DIYAR_OTP_TEST_MODE: 'true'
  DIYAR_OTP_TEST_CODE: '123456'
  DIYAR_MAIL_ENABLED: 'false'
  MAIL_MAILER: log
  DIYAR_ASSISTANT_ENABLED: 'true'
  DIYAR_ASSISTANT_USE_FAKE: 'true'
  DIYAR_MEDIA_OPTIMIZE: 'true'
  DIYAR_MEDIA_WEBP_QUALITY: '82'
  DIYAR_MEDIA_OPTIMIZE_PDF: 'true'
  DIYAR_MEDIA_PDF_QUALITY: /ebook
  FRONTEND_URL: http://localhost:8092
  DIYAR_FRONTEND_URL: http://localhost:8092
  SANCTUM_STATEFUL_DOMAINS: localhost,localhost:8092,127.0.0.1,127.0.0.1:8092,diyar.local,diyar.local:8092
  CORS_ALLOWED_ORIGINS: http://localhost:8092,http://127.0.0.1:8092,http://diyar.local:8092
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: diyar
  REVERB_APP_KEY: diyar-local-key
  REVERB_APP_SECRET: diyar-local-secret
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8090
  REVERB_HOST: localhost
  REVERB_PORT: 8092
  REVERB_SCHEME: http
  REVERB_BROADCAST_HOST: reverb
  REVERB_BROADCAST_PORT: 8090
  REVERB_BROADCAST_SCHEME: http
  REVERB_ALLOWED_ORIGINS: localhost,127.0.0.1,diyar.local

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: sim_root_secret
      MYSQL_DATABASE: diyar_vps_simulation
      MYSQL_USER: diyar
      MYSQL_PASSWORD: sim_db_secret
    volumes:
      - diyar_sim_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-psim_root_secret']
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - diyar_sim_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.fpm
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - ./backend:/var/www/diyar/backend
      - ./deploy/php/fpm-pool-kvm2.conf:/usr/local/etc/php-fpm.d/zz-diyar.conf:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile.fpm
    restart: unless-stopped
    environment:
      <<: *app-env
    command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8090']
    volumes:
      - ./backend:/var/www/diyar/backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.fpm
    restart: unless-stopped
    environment:
      <<: *app-env
    command: ['php', 'artisan', 'queue:work', 'redis', '--queue=critical,notifications-high,notifications,notifications-low,broadcast,chat,chat-low,analytics,default', '--sleep=1', '--tries=3', '--timeout=120']
    volumes:
      - ./backend:/var/www/diyar/backend
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.fpm
    restart: unless-stopped
    environment:
      <<: *app-env
    command: ['sh', '-c', 'while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done']
    volumes:
      - ./backend:/var/www/diyar/backend
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '8092:80'
    volumes:
      - ./deploy/nginx/production-like.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/diyar/frontend/dist:ro
      - ./backend/public:/var/www/diyar/backend/public:ro
      - ./backend/storage:/var/www/diyar/backend/storage:ro
    depends_on:
      - app
      - reverb
    networks:
      - backend

volumes:
  diyar_sim_mysql:
  diyar_sim_redis:

networks:
  backend:
    driver: bridge
