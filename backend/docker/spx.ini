; Phase 18 local profiling only — do not enable in production images by default.
extension=spx.so
spx.http_enabled=1
spx.http_key=dev
spx.http_ip_whitelist=*
spx.http_ui_assets_dir=/usr/local/share/misc/php-spx/assets/web-ui
spx.data_dir=/tmp/spx-data
spx.http_profiling_enabled=1
spx.http_profiling_auto_start=1
spx.http_ip_var=REMOTE_ADDR
