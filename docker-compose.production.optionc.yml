# DIYAR — Hostinger KVM2 Production Docker Compose (Option C — 8 Containers)
#
# Topology:
#   1. Nginx          (Public reverse proxy for Octane HTTP + Reverb WebSocket)
#   2. Octane App     (Laravel Octane on Swoole, 2 workers, 1 task worker)
#   3. Scheduler      (schedule:run 60s loop)
#   4. Queue-Critical (Payments, orders, webhooks: critical,default)
#   5. Queue-Background (Notifications, broadcast, chat, analytics)
#   6. Reverb         (Single WebSocket instance)
#   7. MySQL          (Database — internal only, no host port)
#   8. Redis          (Cache, session, queue — volatile-lru, AOF, internal only)
#
# Frontend: Hosted on Vercel (see deploy/VERCEL.md)
#
# Usage:
#   cp deploy/docker/production.env.example deploy/docker/production.env
#   docker compose -f docker-compose.production.optionc.yml --env-file deploy/docker/production.env up -d --build
#   docker compose -f docker-compose.production.optionc.yml exec app php artisan migrate --force

name: diyar-production

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: 'false'
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-diyar_production}
  DB_USERNAME: ${DB_USERNAME:-diyar}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-180}
  SESSION_DRIVER: redis
  SESSION_CONNECTION: default
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_PREFIX: ${REDIS_PREFIX:-diyar-production-}
  BROADCAST_CONNECTION: reverb
  DIYAR_LOADTEST_MODE: 'false'
  DIYAR_ENFORCE_REDIS_IN_PRODUCTION: 'true'
  DIYAR_PAYMENT_USE_FAKE_GATEWAY: ${DIYAR_PAYMENT_USE_FAKE_GATEWAY:-false}
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL required}
  DIYAR_FRONTEND_URL: ${DIYAR_FRONTEND_URL:-${FRONTEND_URL}}
  DIYAR_LAN_HOST: ${DIYAR_LAN_HOST:-diyar.local}
  DIYAR_GATEWAY_HOST: ${DIYAR_GATEWAY_HOST:-diyar.local}
  GATEWAY_PORT: ${GATEWAY_PORT:-8080}
  FRONTEND_PORT: ${FRONTEND_PORT:-3000}
  HTTP_PORT: ${HTTP_PORT:-8093}
  SANCTUM_STATEFUL_DOMAINS_BASE: ${SANCTUM_STATEFUL_DOMAINS_BASE:-localhost,localhost:3000,127.0.0.1,127.0.0.1:3000}
  CORS_ALLOWED_ORIGINS_BASE: ${CORS_ALLOWED_ORIGINS_BASE:-http://localhost:3000,http://127.0.0.1:3000}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-none}
  APP_URL: ${APP_URL:?APP_URL required}
  REVERB_APP_ID: ${REVERB_APP_ID:-diyar}
  REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY required}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET required}
  REVERB_HOST: ${REVERB_HOST:-realtime.localhost}
  REVERB_PORT: ${REVERB_PORT:-443}
  REVERB_SCHEME: ${REVERB_SCHEME:-https}
  REVERB_BROADCAST_HOST: nginx
  REVERB_BROADCAST_PORT: 80
  REVERB_BROADCAST_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8090
  REVERB_SCALING_ENABLED: 'true'
  REVERB_SCALING_CHANNEL: reverb
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
  DIYAR_MAIL_ENABLED: ${DIYAR_MAIL_ENABLED:-true}

x-app-image: &app-image
  build:
    context: ./backend
    dockerfile: Dockerfile.octane.production
  restart: unless-stopped
  env_file:
    - deploy/docker/production.env
  environment:
    <<: *app-env
  volumes:
    - diyar_storage:/var/www/diyar/backend/storage
  networks:
    - backend
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # 1. Primary Relational Store
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
      MYSQL_DATABASE: ${DB_DATABASE:-diyar_production}
      MYSQL_USER: ${DB_USERNAME:-diyar}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - diyar_mysql:/var/lib/mysql
      - ./deploy/docker/mysql-kvm2.cnf:/etc/mysql/conf.d/99-diyar.cnf:ro
      - diyar_mysql_backups:/backups
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2560M
    networks:
      - backend

  # 2. Redis Store (volatile-lru eviction for queue safety, AOF persistence)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - diyar_redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 576M
    networks:
      - backend

  # 3. HTTP Application Server (Laravel Octane on Swoole)
  app:
    <<: *app-image
    entrypoint: ['sh', 'scripts/docker-production-boot.sh']
    command: ['php', 'artisan', 'octane:start', '--server=swoole', '--host=0.0.0.0', '--port=8000', '--workers=${OCTANE_WORKERS:-2}', '--task-workers=1', '--max-requests=500']
    environment:
      <<: *app-env
      OCTANE_WORKERS: ${OCTANE_WORKERS:-2}
      OCTANE_TASK_WORKERS: ${OCTANE_TASK_WORKERS:-1}
      OCTANE_MAX_REQUESTS: ${OCTANE_MAX_REQUESTS:-500}
    healthcheck:
      test: ['CMD-SHELL', 'php -r "exit(@fsockopen(\"127.0.0.1\",8000)?0:1);"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M

  # 4. Cron Task Scheduler
  scheduler:
    <<: *app-image
    entrypoint: ['sh', 'scripts/docker-production-boot.sh']
    command: ['sh', '-c', 'while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done']
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "schedule:run" >/dev/null || pgrep -f "sleep 60" >/dev/null || exit 1']
      interval: 60s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # 5. Business Critical Queue Worker
  queue-critical:
    <<: *app-image
    entrypoint: ['sh', 'scripts/docker-production-boot.sh']
    command: ['php', 'artisan', 'queue:work', 'redis', '--queue=critical,default', '--sleep=1', '--tries=3', '--timeout=120', '--max-jobs=500', '--max-time=3600']
    healthcheck:
      test: ['CMD-SHELL', 'tr "\\0" " " < /proc/1/cmdline | grep -q "queue:work"']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 384M

  # 6. Background Queue Worker (Consolidated: notifications, broadcast, chat, analytics)
  queue-background:
    <<: *app-image
    entrypoint: ['sh', 'scripts/docker-production-boot.sh']
    command: ['php', 'artisan', 'queue:work', 'redis', '--queue=notifications-high,notifications,notifications-low,broadcast,chat,chat-low,analytics', '--sleep=1', '--tries=3', '--timeout=120', '--max-jobs=500', '--max-time=3600']
    healthcheck:
      test: ['CMD-SHELL', 'tr "\\0" " " < /proc/1/cmdline | grep -q "queue:work"']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 384M

  # 7. WebSocket Server (Single instance)
  reverb:
    <<: *app-image
    environment:
      <<: *app-env
      REVERB_SERVER_PORT: 8090
      DIYAR_RUNTIME_NODE_ID: reverb-1
    entrypoint: ['sh', 'scripts/docker-production-boot.sh']
    command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8090', '--no-interaction']
    healthcheck:
      test: ['CMD-SHELL', 'php -r "exit(@fsockopen(\"127.0.0.1\",8090)?0:1);"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M

  # 8. Public Reverse Proxy
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ${NGINX_CONF:-./deploy/nginx/kvm2-docker-optionc.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/diyar/backend/public:ro
      - diyar_storage:/var/www/diyar/backend/storage:ro
    depends_on:
      app:
        condition: service_started
      reverb:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/api/v1/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - public
      - backend

  # Manual / Scheduled database backup container (ops profile only)
  backup:
    image: mysql:8.0
    profiles: ['ops']
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - diyar_mysql_backups:/backups
    networks:
      - backend
    entrypoint: ['sh', '-c', 'mysqldump -h mysql -uroot $$MYSQL_DATABASE > /backups/diyar-$$(date +%Y%m%d-%H%M%S).sql && find /backups -name "*.sql" -mtime +14 -delete']
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  diyar_mysql:
  diyar_redis:
  diyar_storage:
  diyar_mysql_backups:

networks:
  public:
    driver: bridge
  backend:
    driver: bridge
