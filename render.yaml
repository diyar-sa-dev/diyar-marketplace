# Render Blueprint — API (Docker + Octane) for prod-temp / V1
# Frontend: Vercel (see deploy/RENDER_VERCEL.md)
# Database: Render PostgreSQL (prod-temp). Dev branch stays on MySQL.
#
# FREE tier notes:
# - Web service sleeps when idle (cold starts ~30–60s)
# - Worker service is a separate paid service; omit if using sync queue fallback
# - Use Upstash Redis free tier or Render Redis

services:
  - type: web
    name: diyar-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_PORT
        value: 5432
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: SESSION_SAME_SITE
        value: lax
      - key: DIYAR_ENFORCE_REDIS_IN_PRODUCTION
        value: true
      - key: DIYAR_HEALTH_PROBE_CACHE_SECONDS
        value: 45
      - key: DIYAR_MIGRATE_ON_BOOT
        value: false
      - key: OCTANE_WORKERS
        value: 2
      - key: OCTANE_TASK_WORKERS
        value: 1
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: DIYAR_FRONTEND_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_PORT
        value: 6379

  # Optional — requires Render paid worker. Without this, set QUEUE_CONNECTION=sync
  # on FREE tier or accept delayed notification delivery until worker is provisioned.
  - type: worker
    name: diyar-queue
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    envVars:
      - fromService:
          type: web
          name: diyar-api
          envVarKey: APP_KEY
      - fromService:
          type: web
          name: diyar-api
          envVarKey: APP_URL
      - fromService:
          type: web
          name: diyar-api
          envVarKey: DB_HOST
      - fromService:
          type: web
          name: diyar-api
          envVarKey: DB_DATABASE
      - fromService:
          type: web
          name: diyar-api
          envVarKey: DB_USERNAME
      - fromService:
          type: web
          name: diyar-api
          envVarKey: DB_PASSWORD
      - fromService:
          type: web
          name: diyar-api
          envVarKey: REDIS_HOST
      - fromService:
          type: web
          name: diyar-api
          envVarKey: REDIS_PASSWORD
      - key: APP_ENV
        value: production
      - key: DB_CONNECTION
        value: pgsql
      - key: QUEUE_CONNECTION
        value: redis
