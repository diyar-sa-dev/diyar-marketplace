# DIYAR — Hostinger KVM2 production Docker Compose
#
# Architecture: Nginx (public) → PHP-FPM app → MySQL/Redis (internal only)
#               Reverb ×2 (internal, WS via Nginx /app/)
#               Queue workers ×2, Scheduler ×1
# Frontend: deploy separately on Vercel (see deploy/VERCEL.md)
#
# Usage:
#   cp deploy/docker/production.env.example deploy/docker/production.env
#   # Edit secrets in production.env (never commit)
#   docker compose -f docker-compose.production.yml --env-file deploy/docker/production.env up -d --build
#   docker compose -f docker-compose.production.yml exec app php artisan migrate --force
#
# Optional Octane profile (benchmark / alternate runtime):
#   docker compose -f docker-compose.production.yml -f docker-compose.production.octane.yml up -d --build

name: diyar-production

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: 'false'
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-diyar_production}
  DB_USERNAME: ${DB_USERNAME:-diyar}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_CONNECTION: default
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_PREFIX: ${REDIS_PREFIX:-diyar-production-}
  BROADCAST_CONNECTION: reverb
  DIYAR_LOADTEST_MODE: 'false'
  DIYAR_ENFORCE_REDIS_IN_PRODUCTION: 'true'
  DIYAR_PAYMENT_USE_FAKE_GATEWAY: ${DIYAR_PAYMENT_USE_FAKE_GATEWAY:-false}
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL required}
  DIYAR_FRONTEND_URL: ${DIYAR_FRONTEND_URL:-${FRONTEND_URL}}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?SANCTUM_STATEFUL_DOMAINS required}
  SESSION_SECURE_COOKIE: 'true'
  SESSION_SAME_SITE: none
  APP_URL: ${APP_URL:?APP_URL required}
  REVERB_APP_ID: ${REVERB_APP_ID:-diyar}
  REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY required}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET required}
  REVERB_HOST: ${REVERB_HOST:-realtime.localhost}
  REVERB_PORT: ${REVERB_PORT:-443}
  REVERB_SCHEME: ${REVERB_SCHEME:-https}
  REVERB_BROADCAST_HOST: nginx
  REVERB_BROADCAST_PORT: 80
  REVERB_BROADCAST_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8090
  REVERB_SCALING_ENABLED: 'true'
  REVERB_SCALING_CHANNEL: reverb
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
  DIYAR_MAIL_ENABLED: ${DIYAR_MAIL_ENABLED:-true}

x-app-image: &app-image
  build:
    context: ./backend
    dockerfile: Dockerfile.fpm
  restart: unless-stopped
  env_file:
    - deploy/docker/production.env
  environment:
    <<: *app-env
  volumes:
    - diyar_storage:/var/www/diyar/backend/storage
  networks:
    - backend
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
      MYSQL_DATABASE: ${DB_DATABASE:-diyar_production}
      MYSQL_USER: ${DB_USERNAME:-diyar}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - diyar_mysql:/var/lib/mysql
      - ./deploy/docker/mysql-kvm2.cnf:/etc/mysql/conf.d/99-diyar.cnf:ro
      - diyar_mysql_backups:/backups
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - backend
    # No ports published — internal network only

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - diyar_redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  app:
    <<: *app-image
    entrypoint: ['sh', 'scripts/docker-production-boot.sh']
    command: ['php-fpm', '-F']
    volumes:
      - diyar_storage:/var/www/diyar/backend/storage
      - ./deploy/php/fpm-pool-kvm2.conf:/usr/local/etc/php-fpm.d/zz-diyar.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'php artisan --version >/dev/null 2>&1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ./deploy/nginx/kvm2-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/diyar/backend/public:ro
      - diyar_storage:/var/www/diyar/backend/storage:ro
    depends_on:
      app:
        condition: service_started
      reverb-1:
        condition: service_started
      reverb-2:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/api/v1/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - public
      - backend

  queue-critical:
    <<: *app-image
    entrypoint: ['sh', 'scripts/docker-production-boot.sh']
    command: ['php', 'artisan', 'queue:work', 'redis', '--queue=critical,default', '--sleep=1', '--tries=3', '--timeout=120', '--max-jobs=500', '--max-time=3600']
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "queue:work" >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

  queue-default:
    <<: *app-image
    entrypoint: ['sh', 'scripts/docker-production-boot.sh']
    command: ['php', 'artisan', 'queue:work', 'redis', '--queue=notifications-high,notifications,notifications-low,broadcast,chat,chat-low', '--sleep=1', '--tries=3', '--timeout=120', '--max-jobs=500', '--max-time=3600']
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "queue:work" >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *app-image
    entrypoint: ['sh', 'scripts/docker-production-boot.sh']
    command: ['sh', '-c', 'while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done']
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "schedule:run" >/dev/null || pgrep -f "sleep 60" >/dev/null || exit 1']
      interval: 60s
      timeout: 5s
      retries: 3

  reverb-1:
    <<: *app-image
    environment:
      <<: *app-env
      REVERB_SERVER_PORT: 8090
      DIYAR_RUNTIME_NODE_ID: reverb-1
    entrypoint: ['sh', 'scripts/docker-production-boot.sh']
    command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8090', '--no-interaction']
    healthcheck:
      test: ['CMD-SHELL', 'php -r "exit(@fsockopen(\"127.0.0.1\",8090)?0:1);"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  reverb-2:
    <<: *app-image
    environment:
      <<: *app-env
      REVERB_SERVER_PORT: 8090
      DIYAR_RUNTIME_NODE_ID: reverb-2
    entrypoint: ['sh', 'scripts/docker-production-boot.sh']
    command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8090', '--no-interaction']
    healthcheck:
      test: ['CMD-SHELL', 'php -r "exit(@fsockopen(\"127.0.0.1\",8090)?0:1);"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backup:
    image: mysql:8.0
    profiles: ['ops']
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - diyar_mysql_backups:/backups
    networks:
      - backend
    entrypoint: ['sh', '-c', 'mysqldump -h mysql -uroot $$MYSQL_DATABASE > /backups/diyar-$$(date +%Y%m%d-%H%M%S).sql && find /backups -name "*.sql" -mtime +14 -delete']
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  diyar_mysql:
  diyar_redis:
  diyar_storage:
  diyar_mysql_backups:

networks:
  public:
    driver: bridge
  backend:
    driver: bridge
