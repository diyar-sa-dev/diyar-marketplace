# Local dev gateway — stable URL http://diyar.local:8080 (API + Vite + Reverb on one origin).
# Requires: production stack on :8093, Vite on :3000, hosts entry 127.0.0.1 diyar.local
#
#   docker compose -f docker-compose.local-gateway.yml up -d

name: diyar-local-gateway

services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${GATEWAY_PORT:-8080}:8080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./deploy/nginx/local-dev-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/api/v1/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
