[program:diyar-queue-high]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/diyar/backend/artisan queue:work --queue=notifications-high,notifications,notifications-low --sleep=3 --tries=5 --timeout=120 --max-jobs=1000 --max-time=3600 --memory=128
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/diyar-queue.log
stopwaitsecs=3600

[program:diyar-reverb]
process_name=%(program_name)s
command=php /var/www/diyar/backend/artisan reverb:start
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/diyar-reverb.log
