# DIYAR KVM2 — Docker production Nginx (SPA frontend + API + WebSocket proxy)
# Serves built frontend from /var/www/diyar/frontend/dist for certification / same-origin installs.

resolver 127.0.0.11 valid=10s ipv6=off;

map $remote_addr $diyar_reverb_upstream {
    default reverb-1:8090;
    ~*\.[02468]$ reverb-2:8090;
    ~*\.[13579]$ reverb-1:8090;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_cf_connecting_ip $diyar_client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ /\.(env|git|ht) {
        deny all;
        return 404;
    }

    location ~* \.(sql|bak|log|ini|sh)$ {
        deny all;
        return 404;
    }

    location /app/ {
        set $reverb_upstream $diyar_reverb_upstream;
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $diyar_client_ip;
        proxy_set_header X-Forwarded-For $diyar_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /apps/ {
        set $reverb_upstream $diyar_reverb_upstream;
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $diyar_client_ip;
        proxy_set_header X-Forwarded-For $diyar_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        alias /var/www/diyar/backend/storage/app/public/;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ~ ^/(api|sanctum|broadcasting) {
        root /var/www/diyar/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/diyar/backend/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_REAL_IP $diyar_client_ip;
        fastcgi_param HTTP_X_FORWARDED_FOR $diyar_client_ip;
        set $fpm_upstream app:9000;
        fastcgi_pass $fpm_upstream;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    root /var/www/diyar/frontend/dist;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
}
