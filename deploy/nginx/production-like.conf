# Minimal Nginx for docker-compose.production-like.yml (Phase 28.14+)
# API-only — frontend on Vercel in production; local dev may mount frontend/dist separately.

upstream diyar_fpm {
    server app:9000;
    keepalive 8;
}

upstream diyar_reverb_local {
    server reverb:8090;
    keepalive 4;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 12m;
    server_tokens off;

    location ~ /\.(env|git|ht) {
        deny all;
        return 404;
    }

    location /app/ {
        proxy_pass http://diyar_reverb_local;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /apps/ {
        proxy_pass http://diyar_reverb_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /storage/ {
        alias /var/www/diyar/backend/storage/app/public/;
        try_files $uri =404;
    }

    root /var/www/diyar/backend/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass diyar_fpm;
        fastcgi_read_timeout 120s;
    }
}
