# Minimal Nginx for docker-compose.production-like.yml (Phase 28.14)

upstream diyar_fpm {
    server app:9000;
    keepalive 8;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/diyar/frontend/dist;
    index index.html;

    client_max_body_size 12m;
    server_tokens off;

    location ~ /\.(env|git|ht) {
        deny all;
        return 404;
    }

    location /api/ {
        root /var/www/diyar/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /sanctum/ {
        root /var/www/diyar/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/diyar/backend/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass diyar_fpm;
        fastcgi_read_timeout 120s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
