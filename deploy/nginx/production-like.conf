# DIYAR Local VPS Simulation Nginx Gateway (FPM + Built SPA + Reverb)
# Canonical topology:
#   Browser -> Nginx (:80 / host :8092)
#                ├── Frontend production build (/var/www/diyar/frontend/dist)
#                ├── /api/*, /sanctum/*, /broadcasting/* -> PHP-FPM (app:9000)
#                ├── /app/*, /apps/* -> Laravel Reverb WebSocket (reverb:8090)
#                └── /storage/* -> Local public media storage

upstream diyar_fpm {
    server app:9000;
    keepalive 8;
}

upstream diyar_reverb_local {
    server reverb:8090;
    keepalive 4;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost diyar.local;

    client_max_body_size 12m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Defense-in-depth: block sensitive files
    location ~ /\.(env|git|ht) {
        deny all;
        return 404;
    }

    location ~* \.(sql|bak|log|ini|sh)$ {
        deny all;
        return 404;
    }

    # Realtime Reverb WebSockets
    location /app/ {
        proxy_pass http://diyar_reverb_local;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Realtime Reverb HTTP API
    location /apps/ {
        proxy_pass http://diyar_reverb_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public uploaded media
    location /storage/ {
        alias /var/www/diyar/backend/storage/app/public/;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Backend API, Sanctum stateful auth, and Broadcasting routes
    location ~ ^/(api|sanctum|broadcasting) {
        root /var/www/diyar/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP FastCGI execution for backend
    location ~ \.php$ {
        root /var/www/diyar/backend/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_pass diyar_fpm;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Frontend SPA production build root
    root /var/www/diyar/frontend/dist;
    index index.html;

    # Static assets long-term cache
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
