# Octane upstream for docker-compose.production.octane.yml

upstream diyar_app {
    server app:8000;
    keepalive 16;
}

upstream diyar_reverb {
    least_conn;
    server reverb-1:8090 max_fails=3 fail_timeout=10s;
    server reverb-2:8090 max_fails=3 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ /\.(env|git|ht) {
        deny all;
        return 404;
    }

    location /app/ {
        proxy_pass http://diyar_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location /storage/ {
        alias /var/www/diyar/backend/storage/app/public/;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://diyar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
