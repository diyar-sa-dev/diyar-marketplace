# DIYAR KVM2 — Docker Option C Nginx Configuration (8-Container Topology)
# Reverse proxy for Laravel Octane (Swoole) + Single Reverb WebSocket
# Frontend is hosted on Vercel; Nginx serves API, Sanctum, storage, and WebSocket.

upstream diyar_app {
    server app:8000;
    keepalive 32;
}

upstream diyar_reverb {
    server reverb:8090;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Prefer Cloudflare client IP when present (production behind Cloudflare proxy)
map $http_cf_connecting_ip $diyar_client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

# Preserve incoming forwarded proto (e.g. from Cloudflare) or fall back to $scheme
map $http_x_forwarded_proto $diyar_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 12m;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Block access to hidden, environment, and repository files
    location ~ /\.(env|git|ht) {
        deny all;
        return 404;
    }

    # Block access to database dumps, logs, and sensitive extensions
    location ~* \.(sql|bak|log|ini|sh)$ {
        deny all;
        return 404;
    }

    # Diagnostics endpoint (internal loopback only)
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    # Reverb WebSocket (Pusher protocol: /app/{key})
    location /app/ {
        proxy_pass http://diyar_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $diyar_client_ip;
        proxy_set_header X-Forwarded-For $diyar_client_ip;
        proxy_set_header X-Forwarded-Proto $diyar_forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Reverb HTTP API (event broadcast publishing: /apps/{appId}/events)
    location /apps/ {
        proxy_pass http://diyar_reverb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $diyar_client_ip;
        proxy_set_header X-Forwarded-For $diyar_client_ip;
        proxy_set_header X-Forwarded-Proto $diyar_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Public uploaded media (served directly from shared storage volume)
    location /storage/ {
        alias /var/www/diyar/backend/storage/app/public/;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # HTTP API traffic routed to Laravel Octane (Swoole)
    location / {
        proxy_pass http://diyar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $diyar_client_ip;
        proxy_set_header X-Forwarded-For $diyar_client_ip;
        proxy_set_header X-Forwarded-Proto $diyar_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }

    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
}
