# DIYAR KVM2 — Docker Option C Nginx Configuration (8-Container Topology)
# Reverse proxy for Laravel Octane (Swoole) + Single Reverb WebSocket
# Frontend is hosted on Vercel; Nginx serves API, Sanctum, storage, and WebSocket.

upstream diyar_app {
    server app:8000;
    keepalive 32;
}

upstream diyar_reverb {
    server reverb:8090;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Authoritative Cloudflare IP CIDRs (verified against https://www.cloudflare.com/ips/)
geo $realip_remote_addr $is_cloudflare_proxy {
    default 0;
    # Cloudflare IPv4
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    # Cloudflare IPv6
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Only trust client-supplied X-Forwarded-Proto if request arrived from verified Cloudflare proxy
map "$is_cloudflare_proxy:$http_x_forwarded_proto" $diyar_forwarded_proto {
    "~^1:(https|http)$" $http_x_forwarded_proto;
    default             $scheme;
}

# Structured access log recording effective client IP, connecting TCP peer IP, and verified protocol
log_format diyar_combined '$remote_addr (peer $realip_remote_addr) - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" proto=$diyar_forwarded_proto';

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 12m;

    # Authoritative Cloudflare edge proxy CIDRs for real-IP extraction
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Block access to hidden, environment, and repository files
    location ~ /\.(env|git|ht) {
        deny all;
        return 404;
    }

    # Block access to database dumps, logs, and sensitive extensions
    location ~* \.(sql|bak|log|ini|sh)$ {
        deny all;
        return 404;
    }

    # Diagnostics endpoint (internal loopback only)
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    # Reverb WebSocket (Pusher protocol: /app/{key})
    location /app/ {
        proxy_pass http://diyar_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $diyar_forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Reverb HTTP API (event broadcast publishing: /apps/{appId}/events)
    location /apps/ {
        proxy_pass http://diyar_reverb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $diyar_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Public uploaded media (served directly from shared storage volume)
    location /storage/ {
        alias /var/www/diyar/backend/storage/app/public/;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # HTTP API & Sanctum traffic routed to Laravel Octane (Swoole)
    location ~ ^/(api|sanctum|broadcasting|up) {
        proxy_pass http://diyar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $diyar_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }

    # Frontend SPA Marketplace static assets (cacheable)
    root /var/www/diyar/frontend/dist;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Frontend SPA Marketplace client-side fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/access.log diyar_combined;
    error_log /var/log/nginx/error.log warn;
}
