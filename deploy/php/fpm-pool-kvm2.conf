; DIYAR PHP-FPM pool — Hostinger KVM2 (8 GB RAM)
; Budget: ~512M MySQL buffer + 512M Redis + workers + Reverb + OS ≈ 2.5–3 GB
; PHP-FPM target: ~1–1.5 GB → 8–12 workers @ ~128M

[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

request_terminate_timeout = 120s
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 14M
php_admin_value[max_execution_time] = 120

catch_workers_output = yes
clear_env = no
