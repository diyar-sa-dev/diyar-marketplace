# DIYAR — Local VPS Simulation Octane Override (KVM 2 Profile)
# Usage:
#   docker compose -p diyar-vps-sim -f docker-compose.production-like.yml -f docker-compose.production-like.octane.yml up -d

services:
  app:
    image: diyar-octane-test:latest
    working_dir: /var/www/diyar/backend
    command: ['php', 'artisan', 'octane:start', '--server=swoole', '--host=0.0.0.0', '--port=8000', '--workers=2', '--task-workers=1', '--max-requests=500']
    environment:
      OCTANE_WORKERS: 2
      OCTANE_TASK_WORKERS: 1
      OCTANE_MAX_REQUESTS: 500
    volumes:
      - ./backend:/var/www/diyar/backend
    cpuset: '0-1'
    deploy:
      resources:
        limits:
          memory: 1536M

  mysql:
    cpuset: '0-1'
    deploy:
      resources:
        limits:
          memory: 2560M

  redis:
    cpuset: '0-1'
    deploy:
      resources:
        limits:
          memory: 576M

  queue-worker:
    cpuset: '0-1'
    deploy:
      resources:
        limits:
          memory: 384M

  scheduler:
    cpuset: '0-1'
    deploy:
      resources:
        limits:
          memory: 128M

  reverb:
    cpuset: '0-1'
    deploy:
      resources:
        limits:
          memory: 384M

  nginx:
    cpuset: '0-1'
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - ./deploy/nginx/production-like-octane.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/diyar/frontend/dist:ro
      - ./backend/public:/var/www/diyar/backend/public:ro
      - ./backend/storage:/var/www/diyar/backend/storage:ro

